name: Build Mac

# 手动触发。公开仓库只为用免费的 Mac 构建机；UE 引擎源码只在构建机上临时拉取，不进仓库、不进公开日志。
# 流程：拉 UE 源码（只下 Mac 依赖）→ 只编 ApexDrift 游戏程序（Shipping、Apple 芯片）→
# 用 Windows 上烘焙好的内容（私有仓库 release cooked-mac）打包 → 临时签名 → dmg 和详细日志发到私有仓库 release。
# 编译中间文件存 Actions 缓存，单次 6 小时没编完，下次接着编。
on:
  workflow_dispatch:
    inputs:
      ue_ref:
        description: UE 源码标签（与本机烘焙用的引擎一致）
        default: 5.9.0-preview-2

permissions:
  contents: read

concurrency:
  group: build-mac
  cancel-in-progress: false

jobs:
  mac:
    runs-on: macos-latest
    timeout-minutes: 360
    env:
      UE_REF: ${{ inputs.ue_ref || '5.9.0-preview-2' }}
      PRIVATE_REPO: AdamDashen666/ApexDriftMac
      UE: ${{ github.workspace }}/UnrealEngine
      PROJ: ${{ github.workspace }}/project
      OUT: ${{ github.workspace }}/out
    steps:
      - uses: actions/checkout@v5

      - name: Free disk, pick Xcode
        env:
          GH_TOKEN: ${{ secrets.UE_SOURCE_TOKEN }}
        run: |
          sysctl -n machdep.cpu.brand_string hw.ncpu hw.memsize; sw_vers
          KEEP=/Applications/Xcode_26.1.1.app
          [ -d "$KEEP" ] || KEEP=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)
          sudo xcode-select -s "$KEEP"
          for x in /Applications/Xcode*.app; do [ -L "$x" ] || [ "$x" = "$KEEP" ] || sudo rm -rf "$x" & done; wait
          sudo rm -rf ~/Library/Android /usr/local/share/android-sdk "$RUNNER_TOOL_CACHE"/* ~/.dotnet /usr/local/share/dotnet ~/.ghcup ~/.rustup ~/.cargo 2>/dev/null || true
          # 构建机只有 3 核 7GB 内存：关掉 Spotlight，别让它去索引几十 GB 的源码和编译产物
          sudo mdutil -a -i off >/dev/null 2>&1 || true
          xcodebuild -version; df -h /System/Volumes/Data
          memory_pressure | tail -1; sysctl -n vm.swapusage
          mkdir -p "$OUT/logs"
          # actions/cache 存缓存时用 “zstd -T0 --long=30” 压缩：1GB 窗口 × 多线程，在 7GB 内存的构建机上会把机器压垮
          # （2026-11 第 5 次构建编译成功后在存缓存时失联）。放一个包装：压缩时去掉 --long、限 2 线程；解压原样，旧缓存照样能读
          REAL=$(command -v zstd || true)
          if [ -n "$REAL" ]; then
            W="$RUNNER_TEMP/zstdwrap"; mkdir -p "$W"
            printf '%s\n' '#!/bin/bash' "REAL=$REAL" \
              'for a in "$@"; do case "$a" in -d|--decompress|-dc|-cd) exec "$REAL" "$@";; esac; done' \
              'args=(); for a in "$@"; do case "$a" in --long*|-T*) ;; *) args+=("$a");; esac; done' \
              'exec "$REAL" -T2 "${args[@]}"' > "$W/zstd"
            cp "$W/zstd" "$W/zstdmt"; chmod +x "$W/zstd" "$W/zstdmt"
            echo "$W" >> "$GITHUB_PATH"
            echo "zstd 包装：$REAL"
          fi
          # 心跳：整个任务期间每分钟把内存、交换区、磁盘、最占内存的进程和编译进度传到私有仓库 release heartbeat。
          # 构建机失联时作业日志会整个丢掉，靠它看最后的状态；后台进程会一直活到任务结束
          gh release view heartbeat -R "$PRIVATE_REPO" >/dev/null 2>&1 || \
            gh release create heartbeat -R "$PRIVATE_REPO" --prerelease --title "构建机心跳" --notes "每次 Mac 构建的状态记录，构建机失联时看最后一次。" >/dev/null 2>&1 || true
          HB="$OUT/logs/heartbeat-${{ github.run_number }}.txt"
          nohup bash -c 'while true; do
              { date; uptime; memory_pressure 2>/dev/null | tail -1; sysctl vm.swapusage; df -h /System/Volumes/Data | tail -1
                echo; ps -axo rss=,pcpu=,comm= | sort -rn | head -10
                echo; grep -a -o -E "^\[[0-9]+/[0-9]+\]" "$OUT/logs/uat.log" 2>/dev/null | tail -1; tail -n 3 "$OUT/logs/uat.log" 2>/dev/null; } > "$0" 2>&1
              gh release upload heartbeat -R "$1" "$0" --clobber >/dev/null 2>&1
              sleep 60
            done' "$HB" "$PRIVATE_REPO" >/dev/null 2>&1 &

      - name: UE source
        env:
          TOKEN: ${{ secrets.UE_SOURCE_TOKEN }}
        run: |
          [ -n "$TOKEN" ] || { echo "::error::没有配置 UE_SOURCE_TOKEN"; exit 1; }
          AUTH=$(printf 'x-access-token:%s' "$TOKEN" | base64 | tr -d '\n')
          # 令牌只放在这一条命令的参数里，不写进 .git/config
          git -c http.extraheader="AUTHORIZATION: basic $AUTH" clone -q --depth 1 --branch "$UE_REF" \
            https://github.com/EpicGames/UnrealEngine.git "$UE"
          du -sh "$UE"

      - name: Engine dependencies (Mac only)
        timeout-minutes: 40
        run: |
          cd "$UE"
          # 不能排除 iOS/tvOS/visionOS：UAT 启动时要编这些平台的打包脚本，缺资源会编不过
          EX=""; for p in Win64 Win32 Linux LinuxArm64 Android HoloLens; do EX="$EX --exclude=$p"; done
          # --no-cache：默认还会另存最多 2 倍下载量的缓存，会把构建机硬盘撑满（2026-11 第二次构建因此失联）
          ( while sleep 60; do df -h /System/Volumes/Data | awk 'NR==2{print "空闲 " $4}'; done ) &
          W=$!
          ./Setup.sh --force --no-cache $EX > "$OUT/logs/setup.log" 2>&1 || { kill $W; tail -c 3000 "$OUT/logs/setup.log"; exit 1; }
          kill $W
          tail -c 300 "$OUT/logs/setup.log"; echo
          du -sh "$UE"; df -h /System/Volumes/Data
          # 统一时间戳：缓存恢复的编译产物比源码新，UBT 才会跳过已编过的部分
          find "$UE/Engine/Source" "$UE/Engine/Plugins" "$UE/Engine/Shaders" "$PROJ/Source" -type f -exec touch -t 202001010000 {} +

      - name: Cooked content (from private repo)
        env:
          GH_TOKEN: ${{ secrets.UE_SOURCE_TOKEN }}
        run: |
          mkdir -p "$RUNNER_TEMP/cooked"
          gh release download cooked-mac -R "$PRIVATE_REPO" -D "$RUNNER_TEMP/cooked" -p 'cooked-mac.tgz.part*'
          cat "$RUNNER_TEMP"/cooked/cooked-mac.tgz.part* | tar -xzf - -C "$PROJ"
          rm -rf "$RUNNER_TEMP/cooked"
          ls "$PROJ/Saved/Cooked/Mac/ApexDrift/Content/Maps" | grep umap; du -sh "$PROJ/Saved/Cooked/Mac"

      # 恢复缓存失败不该让整次构建失败（2026-11 第 7 次构建解压缓存时构建机卡住 9 分钟后这一步失败）：
      # 失败就删掉可能只解了一半的目录，从头完整编译（约 2–3 小时，仍在 6 小时内）
      - name: Restore build cache
        id: restore_build
        continue-on-error: true
        timeout-minutes: 20
        uses: actions/cache/restore@v4
        with:
          path: |
            project/Intermediate/Build
            project/Binaries
          key: ue-mac-${{ env.UE_REF }}-${{ github.run_id }}
          restore-keys: ue-mac-${{ env.UE_REF }}-

      # 打包工具 UnrealPak 是引擎程序，编译产物在引擎目录里，单独缓存（和上面的缓存分开，互不影响）
      - name: Restore engine tools cache
        id: restore_tools
        continue-on-error: true
        timeout-minutes: 10
        uses: actions/cache/restore@v4
        with:
          path: |
            UnrealEngine/Engine/Intermediate/Build/Mac
            UnrealEngine/Engine/Binaries/Mac
          key: ue-mac-tools-${{ env.UE_REF }}-${{ github.run_id }}
          restore-keys: ue-mac-tools-${{ env.UE_REF }}-

      - name: Discard half-restored cache
        if: steps.restore_build.outcome != 'success' || steps.restore_tools.outcome != 'success'
        run: |
          echo "::warning::恢复编译缓存失败，删掉可能不完整的目录，这次从头完整编译"
          if [ "${{ steps.restore_build.outcome }}" != success ]; then rm -rf project/Intermediate/Build project/Binaries; fi
          if [ "${{ steps.restore_tools.outcome }}" != success ]; then rm -rf UnrealEngine/Engine/Intermediate/Build/Mac UnrealEngine/Engine/Binaries/Mac; fi
          df -h /System/Volumes/Data | tail -1

      # 完整输出只写进日志文件（会传到私有仓库），公开日志里只打印结果行，不打印引擎源码片段
      - name: Build, stage, package
        id: build
        timeout-minutes: 310
        run: |
          cd "$UE"
          T0=$(date +%s)
          set +e
          # 7GB 内存同时跑 3 个编译再加主程序链接会把构建机压垮（2026-11 第 4 次构建失联），最多并行 2 个
          mkdir -p Engine/Saved/UnrealBuildTool
          printf '%s\n' '<?xml version="1.0" encoding="utf-8" ?>' \
            '<Configuration xmlns="https://www.unrealengine.com/BuildConfiguration">' \
            '  <BuildConfiguration><MaxParallelActions>2</MaxParallelActions></BuildConfiguration>' \
            '</Configuration>' > Engine/Saved/UnrealBuildTool/BuildConfiguration.xml
          # 公开日志每 5 分钟报一次：只打印编译计数和内存数字（详细心跳在私有仓库）
          ( while sleep 300; do
              P=$(grep -a -o -E '^\[[0-9]+/[0-9]+\]' "$OUT/logs/uat.log" 2>/dev/null | tail -1)
              M=$(memory_pressure 2>/dev/null | tail -1 | grep -o -E '[0-9]+%')
              SW=$(sysctl -n vm.swapusage | awk '{print $6}')
              echo "进度 $(( ($(date +%s) - T0) / 60 )) 分钟：编译 ${P:-尚未开始}，空闲内存 ${M}，交换区已用 ${SW}"
            done ) &
          PROG=$!
          # -DisableAdaptiveUnity：不用 git status 挑文件（UE 源码太大会超时），每次分组一致，缓存才稳定
          ./Engine/Build/BatchFiles/RunUAT.sh BuildCookRun -project="$PROJ/ApexDrift.uproject" -noP4 -platform=Mac \
            -clientconfig=Shipping -build -skipcook -stage -pak -iostore -package -archive -archivedirectory="$OUT/archive" \
            -ubtargs=-DisableAdaptiveUnity -nocompileeditor -utf8output -unattended > "$OUT/logs/uat.log" 2>&1
          CODE=$?
          kill $PROG 2>/dev/null
          echo "UAT 退出码 ${CODE}，用时 $(( ($(date +%s) - T0) / 60 )) 分钟"
          grep -c -E "\] Compile " "$OUT/logs/uat.log" | sed 's/^/编译步骤数 /' || true
          grep -E "BUILD (SUCCESSFUL|FAILED)|AutomationTool exiting|Total execution time|Result: " "$OUT/logs/uat.log" | tail -10
          grep -o -E "[A-Za-z0-9_./-]+\.(cpp|h|mm|cs):[0-9]+(:[0-9]+)?: (fatal )?error" "$OUT/logs/uat.log" | sort -u | head -20
          exit $CODE

      # 存缓存前先腾内存：UBT / MSBuild 常驻进程和 xcodebuild 还占着几百 MB 到 GB
      - name: Free memory before saving cache
        if: always() && steps.build.outcome != 'skipped'
        run: |
          memory_pressure | tail -1
          pkill -f "UnrealEngine/Engine/Binaries/ThirdParty/DotNet" || true
          pkill -f "UnrealEngine/Engine/Binaries/Mac/Uba" || true
          pkill -x xcodebuild || true
          sleep 3; sync; sudo purge || true
          memory_pressure | tail -1; sysctl -n vm.swapusage
          du -sh project/Intermediate/Build project/Binaries UnrealEngine/Engine/Intermediate/Build/Mac UnrealEngine/Engine/Binaries/Mac 2>/dev/null || true

      - name: Save build cache
        if: always() && steps.build.outcome != 'skipped'
        uses: actions/cache/save@v4
        with:
          path: |
            project/Intermediate/Build
            project/Binaries
          key: ue-mac-${{ env.UE_REF }}-${{ github.run_id }}

      - name: Save engine tools cache
        if: always() && steps.build.outcome != 'skipped'
        uses: actions/cache/save@v4
        with:
          path: |
            UnrealEngine/Engine/Intermediate/Build/Mac
            UnrealEngine/Engine/Binaries/Mac
          key: ue-mac-tools-${{ env.UE_REF }}-${{ github.run_id }}

      - name: Sign and make dmg
        run: |
          SRC=$(find "$OUT/archive" -maxdepth 3 -name "*.app" | head -1)
          [ -n "$SRC" ] || { echo "::error::没找到打包出的 .app"; find "$OUT/archive" -maxdepth 3; exit 1; }
          STAGE="$RUNNER_TEMP/dmg"; mkdir -p "$STAGE"
          APP="$STAGE/APEX DRIFT.app"
          ditto "$SRC" "$APP"
          xattr -cr "$APP"
          codesign --force --deep --sign - "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"
          BIN="$APP/Contents/MacOS/$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP/Contents/Info.plist")"
          lipo -archs "$BIN"; du -sh "$APP"
          # 检查：App 信息、图标、两套 Metal 着色器（SM6 给 M2+ 且 macOS 15+，SM5 给 M1 或 macOS 14）
          plutil -p "$APP/Contents/Info.plist" | grep -E "CFBundle(DisplayName|Name|Identifier|ShortVersionString|IconName|IconFile)|NSHighResolutionCapable|LSApplicationCategoryType|LSMinimumSystemVersion" || true
          ls "$APP/Contents/Resources" | grep -i -E "\.icns$|Assets\.car" || echo "::warning::没找到图标资源"
          find "$APP" \( -name "*.metallib" -o -name "*.metalmap" \) -exec ls -la {} \; | awk '{print $5, $NF}' | sed "s#.*/Contents/#Contents/#"
          for sm in sm5 sm6; do find "$APP" -iname "*metal_${sm}*" | grep -q . && echo "着色器 ${sm}：有" || echo "::warning::包里没找到 ${sm} 的着色器库文件（也可能打进了 pak）"; done
          cp "$PROJ/CREDITS.txt" "$STAGE/"
          cp mac/*.txt mac/*.command "$STAGE/"
          chmod +x "$STAGE"/*.command
          ln -s /Applications "$STAGE/Applications"
          for i in 1 2 3; do hdiutil create -volname "APEX DRIFT" -srcfolder "$STAGE" -ov -format UDZO -fs HFS+ "$OUT/ApexDrift-mac.dmg" && break; sleep 10; done
          hdiutil verify "$OUT/ApexDrift-mac.dmg"
          ls -la "$OUT"/*.dmg
          echo "MAC_BIN=$BIN" >> "$GITHUB_ENV"

      # 构建机是虚拟 GPU，能不能跑起 Nanite/Lumen 不一定；跑不起来只记录，不算失败
      - name: Smoke test
        continue-on-error: true
        run: |
          mkdir -p "$OUT/logs/shots"
          "$MAC_BIN" -ApexMap=TrainingPark -windowed -ResX=1600 -ResY=900 > "$OUT/logs/run.log" 2>&1 &
          P=$!
          for t in 30 60 90; do sleep 30; kill -0 $P 2>/dev/null || break; screencapture -x "$OUT/logs/shots/run_$t.png" || true; done
          kill $P 2>/dev/null || true; sleep 3; kill -9 $P 2>/dev/null || true
          grep -c -E "Error|Fatal" "$OUT/logs/run.log" | sed 's/^/运行日志错误行数 /' || true
          cp ~/Library/Logs/ApexDrift/*.log "$OUT/logs/" 2>/dev/null || true
          find ~/Library/Logs/DiagnosticReports -name "*ApexDrift*" -exec cp {} "$OUT/logs/" \; 2>/dev/null || true

      - name: Upload dmg and logs to private repo
        if: always()
        env:
          GH_TOKEN: ${{ secrets.UE_SOURCE_TOKEN }}
        run: |
          TAG="mac-build-${{ github.run_number }}"
          tar -czf "$RUNNER_TEMP/logs-${{ github.run_number }}.tgz" -C "$OUT" logs
          gh release create "$TAG" -R "$PRIVATE_REPO" --prerelease --title "Mac 版 #${{ github.run_number }}" \
            --notes "UE ${UE_REF} 源码编译，Apple 芯片，临时签名（未经苹果公证）。构建：${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            "$RUNNER_TEMP/logs-${{ github.run_number }}.tgz" $(ls "$OUT"/ApexDrift-mac.dmg 2>/dev/null)
          echo "已发到私有仓库 release $TAG"
