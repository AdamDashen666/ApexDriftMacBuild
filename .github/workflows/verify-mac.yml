name: Verify Mac

# 手动触发：从私有仓库下载某次构建的 dmg，装好后用 -nullrhi（不渲染）在每张图上跑游戏自带的自动漂移测试，
# 验证 Mac 版能读 Windows 烘焙的内容、地图/车辆/物理逻辑正常。
# 必须固定步长（-UseFixedTimeStep，Shipping 版里 -FPS= 被编译掉了，固定是 30Hz）：不渲染时会跑到每秒几千帧，车辆物理和自动驾驶失真；
# t.MaxFPS 没用，游戏启动时会把帧率上限设回 0（不限帧率）。
# 构建机的虚拟显卡只到 Apple5，UE 5.9 要求 Apple7（M1 起），所以这里验证不了画面和着色器。
on:
  workflow_dispatch:
    inputs:
      build:
        description: 私有仓库 release 名（mac-build-N）
        default: mac-build-21

permissions:
  contents: read

jobs:
  verify:
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      PRIVATE_REPO: AdamDashen666/ApexDriftMac
      OUT: ${{ github.workspace }}/out
    steps:
      - name: Get dmg
        env:
          GH_TOKEN: ${{ secrets.UE_SOURCE_TOKEN }}
        run: |
          mkdir -p "$OUT/verify"
          gh release download "${{ inputs.build }}" -R "$PRIVATE_REPO" -p 'ApexDrift-mac.dmg' -D "$RUNNER_TEMP"
          hdiutil attach -nobrowse -readonly "$RUNNER_TEMP/ApexDrift-mac.dmg" -mountpoint /Volumes/APEXDRIFT
          ls /Volumes/APEXDRIFT
          ditto "/Volumes/APEXDRIFT/APEX DRIFT.app" "$HOME/Applications/APEX DRIFT.app"
          hdiutil detach /Volumes/APEXDRIFT
          APP="$HOME/Applications/APEX DRIFT.app"
          codesign --verify --deep --strict "$APP" && echo "签名有效"
          echo "BIN=$APP/Contents/MacOS/$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP/Contents/Info.plist")" >> "$GITHUB_ENV"

      - name: Auto drift lap on each map (no rendering)
        continue-on-error: true
        run: |
          for m in TrainingPark FujiSakura MomijiTouge KuroshioCircuit; do
            T0=$(date +%s)
            "$BIN" -nullrhi -unattended -UseFixedTimeStep -ApexBench -ApexBenchAuto -ApexBenchSecs=220 -ApexMap=${m} -ApexBenchLabel=mac_${m} > "$OUT/verify/run_${m}.log" 2>&1 &
            P=$!
            for i in $(seq 1 360); do kill -0 $P 2>/dev/null || break; sleep 1; done
            if kill -0 $P 2>/dev/null; then kill -9 $P; echo "${m}：6 分钟没结束，已强制关闭"; else wait $P; echo "${m}：退出码 $?，用时 $(( $(date +%s) - T0 )) 秒"; fi
          done
          find ~/Library -path "*ApexDrift*" -name "mac_*" -type f 2>/dev/null | while read f; do cp "$f" "$OUT/verify/"; done
          ls -la "$OUT/verify"
          for f in "$OUT"/verify/mac_*_auto.txt; do [ -f "$f" ] && { echo "== $(basename "$f")"; head -15 "$f"; }; done
          for f in "$OUT"/verify/mac_*.json; do [ -f "$f" ] && { echo "== $(basename "$f")"; head -4 "$f"; }; done
          find ~/Library/Logs/DiagnosticReports -name "*ApexDrift*" -exec cp {} "$OUT/verify/" \; 2>/dev/null || true
          # 构建机是全新的：跑分模式不该写出存档
          if find ~/Library -name "ApexDriftProfile_v2.sav" 2>/dev/null | grep -q .; then echo "::warning::跑分写了存档"; else echo "跑分没有写存档"; fi

      # 三圈竞速真正跑完到结算（最短的黑潮港湾，Windows 上约 3.5 分钟）；旧版程序不认 -ApexBenchRace，只会跑一圈、没有 race.txt
      - name: Three-lap race to the finish screen (no rendering)
        continue-on-error: true
        run: |
          T0=$(date +%s)
          "$BIN" -nullrhi -unattended -UseFixedTimeStep -ApexBench -ApexBenchRace -ApexBenchSpeed=330 -ApexBenchSecs=600 -ApexMap=KuroshioCircuit -ApexBenchLabel=mac_race > "$OUT/verify/run_race.log" 2>&1 &
          P=$!
          for i in $(seq 1 900); do kill -0 $P 2>/dev/null || break; sleep 1; done
          if kill -0 $P 2>/dev/null; then kill -9 $P; echo "15 分钟没结束，已强制关闭"; else wait $P; echo "退出码 $?，用时 $(( $(date +%s) - T0 )) 秒"; fi
          find ~/Library -path "*ApexDrift*" -name "mac_race*" -type f 2>/dev/null | while read f; do cp "$f" "$OUT/verify/"; done
          cat "$OUT"/verify/mac_race_race.txt 2>/dev/null || echo "::warning::没有三圈完赛结果（程序太旧，或没跑完）"

      # 拟真档（轮胎物理，v2.8 调过牵引力控制）：平地 14 个“键盘玩家平时开车”场景（牵引力控制开），
      # 再跑关掉牵引力控制的物理场景（直线加速、甩尾、倒着滑、原地转圈）。和 Windows 的 ship_grip / ship_sim 对照
      - name: Sim handling scenarios (no rendering)
        continue-on-error: true
        run: |
          for t in grip sim; do
            if [ "$t" = grip ]; then A="-ApexBenchGrip"; else A="-ApexBenchSim -ApexSimNoTCS"; fi
            T0=$(date +%s)
            "$BIN" -nullrhi -unattended -UseFixedTimeStep -ApexBench -ApexBenchPad ${A} -ApexAssist=2 -ApexAuto -ApexBenchNoUI -ApexBenchLabel=mac_${t} > "$OUT/verify/run_${t}.log" 2>&1 &
            P=$!
            for i in $(seq 1 600); do kill -0 $P 2>/dev/null || break; sleep 1; done
            if kill -0 $P 2>/dev/null; then kill -9 $P; echo "${t}：10 分钟没结束，已强制关闭"; else wait $P; echo "${t}：退出码 $?，用时 $(( $(date +%s) - T0 )) 秒"; fi
            find ~/Library -path "*ApexDrift*" -name "mac_${t}*" -type f 2>/dev/null | while read f; do cp "$f" "$OUT/verify/"; done
            grep "^=== " "$OUT/verify/mac_${t}_pad.txt" 2>/dev/null || echo "::warning::没有 ${t} 场景结果（程序太旧，或没跑完）"
          done

      # dmg 里给玩家的性能测试脚本：用无渲染模式、两项短测试完整跑一遍（找 App、启动、收结果、出汇总表）
      - name: Perf script self-test (no rendering)
        continue-on-error: true
        run: |
          hdiutil attach -nobrowse -readonly "$RUNNER_TEMP/ApexDrift-mac.dmg" -mountpoint /Volumes/APEXDRIFT
          cp /Volumes/APEXDRIFT/*.command "$RUNNER_TEMP/"
          ls -la /Volumes/APEXDRIFT
          hdiutil detach /Volumes/APEXDRIFT
          APEX_NO_PROMPT=1 APEX_PERF_OUT="$OUT/verify/perf" APEX_EXTRA_ARGS="-nullrhi -unattended -UseFixedTimeStep" \
            APEX_PERF_RUNS=$'TrainingPark 1 20 0\nFujiSakura 3 20 0' bash "$RUNNER_TEMP"/*.command
          ls -la "$OUT/verify/perf"

      - name: Upload results to private repo
        if: always()
        env:
          GH_TOKEN: ${{ secrets.UE_SOURCE_TOKEN }}
        run: |
          tar -czf "$RUNNER_TEMP/verify-${{ github.run_number }}.tgz" -C "$OUT" verify
          gh release upload "${{ inputs.build }}" -R "$PRIVATE_REPO" --clobber "$RUNNER_TEMP/verify-${{ github.run_number }}.tgz"
